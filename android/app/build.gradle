plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.hilwitz.dashly_delivery"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.hilwitz.dashly_delivery"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        baseline file("lint-baseline.xml")
        lintConfig file("../geolocator_android_lint.xml")
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Add the dependencies for Firebase Authentication
    implementation 'com.google.firebase:firebase-auth:21.1.0'
    
    // Add SafetyNet API for phone auth verification
    implementation 'com.google.android.gms:play-services-safetynet:17.0.0'
    
    // Add Play Integrity API for phone auth verification in newer Android versions
    implementation 'com.google.android.play:integrity:1.1.0'
    
    // Support for multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}
